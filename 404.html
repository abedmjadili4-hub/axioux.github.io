<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIOUX — الصفحة غير موجودة</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060A14;
    --text: #F8F7F3;
    --muted: #94A3B8;
    --blue: #3B82F6;
    --blue-light: #60A5FA;
    --border: rgba(148, 163, 184, 0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(1100px 600px at 50% -10%, rgba(59, 130, 246, 0.16), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    text-align: center;
  }
  .mark {
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: 2rem;
    letter-spacing: 0.22em;
    margin-bottom: 6px;
  }
  .slogan {
    color: var(--blue-light);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.32em;
    margin-bottom: 34px;
  }
  .code {
    font-family: 'Cairo', sans-serif;
    font-size: clamp(4rem, 14vw, 7rem);
    font-weight: 800;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 1px rgba(96, 165, 250, 0.55);
    margin-bottom: 10px;
  }
  h1 { font-family: 'Cairo', sans-serif; font-size: 1.35rem; margin-bottom: 10px; }
  p { color: var(--muted); max-width: 46ch; margin: 0 auto 26px; line-height: 1.9; }
  a {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 100px;
    background: var(--blue);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(59, 130, 246, 0.35);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  a:hover { transform: translateY(-2px); background: #2563EB; }
</style>
</head>
<body>
  <main>
    <div class="mark">AXIOUX</div>
    <div class="slogan">THE ART OF BEING WORTHY</div>
    <div class="code">404</div>
    <h1>الصفحة غير موجودة</h1>
    <p>الرابط الذي فتحته غير صحيح أو تم نقله. ارجع للصفحة الرئيسية، وهناك بتلاقي المشاريع والمقالات وفريق العمل.</p>
    <a href="/">العودة للرئيسية</a>
  </main>
</body>
</html>
